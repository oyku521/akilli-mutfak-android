name: Diagnose emulator report
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Android-emulator-evidence
          path: reports
          run-id: 40087353080
          github-token: ${{ github.token }}
      - name: Read test results into an isolated diagnostic branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,base64,urllib.request,xml.etree.ElementTree as ET
          from pathlib import Path
          result={'source_run':'40087353080','files':[], 'test_reports':[]}
          for path in Path('reports').rglob('*'):
              if path.is_file(): result['files'].append(str(path))
              if path.is_file() and path.name.startswith('TEST-') and path.suffix=='.xml':
                  root=ET.parse(path).getroot()
                  item={'path':str(path),'attributes':root.attrib,'failures':[]}
                  for case in root.iter('testcase'):
                      for failure in list(case.findall('failure'))+list(case.findall('error')):
                          item['failures'].append({'test':case.get('name'),'message':failure.get('message'),'detail':(failure.text or '')[:20000]})
                  result['test_reports'].append(item)
          repository=os.environ['GITHUB_REPOSITORY']
          branch='ci-diagnostics-'+os.environ['GITHUB_RUN_ID']
          def api(path,payload):
              request=urllib.request.Request('https://api.github.com/repos/'+repository+'/'+path,data=json.dumps(payload).encode(),method='POST' if path=='git/refs' else 'PUT',headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(request,timeout=30) as response:return json.load(response)
          api('git/refs',{'ref':'refs/heads/'+branch,'sha':os.environ['GITHUB_SHA']})
          api('contents/emulator-diagnostic.json',{'message':'Record emulator test diagnostics','branch':branch,'content':base64.b64encode(json.dumps(result,ensure_ascii=False,indent=2).encode()).decode()})
          print('Diagnostic report saved on branch: '+branch)
          PY
