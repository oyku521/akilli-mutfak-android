name: Lebanese Mezze - Android build and gameplay
on:
  push:
    branches: [lebanese-mezze]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build APK and verify scoring
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit tests and Android lint
        run: ./gradlew --no-daemon --max-workers=2 assembleDebug testDebugUnitTest lintDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: Lebanese-Mezze-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Build-test-and-lint-reports
          path: |
            app/build/reports/
            app/build/test-results/
  emulator:
    name: Android emulator gameplay and recording
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/record-gameplay.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-emulator-video-and-screenshots
          path: |
            evidence/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
