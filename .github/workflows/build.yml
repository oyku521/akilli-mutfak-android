name: Build Android APK
on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew*'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      run_emulator:
        description: 'Run Android emulator tests and save a screenshot'
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Find Android project
        id: project
        shell: bash
        run: |
          if [ -f android-app/settings.gradle.kts ]; then
            echo 'path=android-app' >> "$GITHUB_OUTPUT"
          else
            echo 'path=.' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
      - name: Build APK and run lint
        working-directory: ${{ steps.project.outputs.path }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 assembleDebug lintDebug
      - name: Verify APK signature and contents
        working-directory: ${{ steps.project.outputs.path }}
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          python3 - <<'PY'
          import json, zipfile
          with zipfile.ZipFile('app/build/outputs/apk/debug/app-debug.apk') as apk:
              names = apk.namelist()
              assert 'AndroidManifest.xml' in names
              assert any(n.startswith('classes') and n.endswith('.dex') for n in names)
              assert len(json.loads(apk.read('assets/recipes.json'))) == 50
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Akilli-Mutfak-APK
          path: ${{ steps.project.outputs.path }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-lint-report
          path: ${{ steps.project.outputs.path }}/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
  emulator:
    if: github.event_name == 'workflow_dispatch' && inputs.run_emulator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Find Android project
        id: project
        shell: bash
        run: |
          if [ -f android-app/settings.gradle.kts ]; then
            echo 'path=android-app' >> "$GITHUB_OUTPUT"
          else
            echo 'path=.' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            cd '${{ steps.project.outputs.path }}' && chmod +x gradlew && ./gradlew --no-daemon --max-workers=2 connectedDebugAndroidTest
            adb shell am start -n com.oyku.akillimutfak/com.student.recipes.MainActivity
            sleep 5
            adb shell screencap -p /sdcard/akilli-mutfak.png
            adb pull /sdcard/akilli-mutfak.png emulator-screenshot.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-emulator-evidence
          path: |
            emulator-screenshot.png
            **/app/build/reports/androidTests/connected/**
          if-no-files-found: ignore
