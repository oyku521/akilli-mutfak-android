name: Publish approved gameplay video
on:
  push:
    branches: [lebanese-mezze]
    paths: ['.github/workflows/share-video.yml']
permissions:
  contents: read
jobs:
  share:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Publish user-approved MP4 download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run download 41596436188 --name Android-emulator-video-and-screenshots --dir delivery
          VIDEO_PATH=$(find delivery -name mezze-gameplay.mp4 -type f -print -quit)
          test -n "$VIDEO_PATH"
          test -s "$VIDEO_PATH"
          gh release create lebanese-mezze-restaurant-v2 "$VIDEO_PATH" --target lebanese-mezze --title "Lebanese Mezze - Restaurant Gameplay" --notes "User-approved public MP4 from successful Android emulator test run 41596436188. Download mezze-gameplay.mp4 and upload it to YouTube for the exam."
